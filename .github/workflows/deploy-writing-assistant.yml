# Publishes apps/ai-writing-assistant as a static site on GitHub Pages.
# In the hosted version, each visitor pastes their own Anthropic API key.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions". Without it the
# deploy job fails because the repository has no Pages site.
name: Deploy AI Writing Assistant

on:
  push:
    branches: [main]
    paths: ["apps/ai-writing-assistant/**", ".github/workflows/deploy-writing-assistant.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-writing-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ai-writing-assistant/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/ai-writing-assistant/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
